<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework Js 14</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <div class="card">
      <h1>Random String Generator</h1>
      <label for="length">Length:</label>
      <input type="number" id="length" min="1" value="10" /><br /><br />

      <label
        ><input type="checkbox" id="includeNumbers" /> Numeric digits
        (0-9)</label
      ><br />
      <label
        ><input type="checkbox" id="includeUppercase" /> Uppercase Letters
        (A-Z)</label
      ><br />
      <label
        ><input type="checkbox" id="includeLowercase" /> Lowercase Letters
        (a-z)</label
      ><br /><br />

      <button id="generate">Generate</button><br /><br />

      <label for="result">Generated String:</label>
      <textarea id="result" readonly></textarea>
      <button id="copy">Copy</button><br /><br />
    </div>
    <script src="script.js"></script>
  </body>
</html>
